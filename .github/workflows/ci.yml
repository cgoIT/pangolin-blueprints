name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installieren
        run: pip install ".[write]" pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Paket bauen
        run: pip install build && python -m build
