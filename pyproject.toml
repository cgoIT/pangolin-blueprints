[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pangolin-labels"
version = "0.3.0"
description = "Gefuehrter Generator fuer Pangolin-Blueprint-Labels aus Docker-Compose-Dateien"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
write = ["ruamel.yaml>=0.18"]  # fuer --write-custom (erhaelt Kommentare)

[project.scripts]
pangolin-labels = "pangolin_labels:main"

[tool.setuptools]
py-modules = ["pangolin_labels"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # lange Hilfetexte
